<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UNKNOWN</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Arial, sans-serif;
      color: white;
      background: #02030b;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(
          circle at center,
          transparent 5%,
          rgba(10, 5, 25, 0.35) 45%,
          rgba(0, 0, 0, 0.9) 100%
        );
    }

    .screen {
      position: fixed;
      inset: 0;
      z-index: 2;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 25px;
      text-align: center;
    }

    .screen.active {
      display: flex;
      animation: appear 0.8s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(1.04);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .content {
      width: min(750px, 94vw);
    }

    .small {
      color: #b98cff;
      font-size: 11px;
      letter-spacing: 5px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(48px, 10vw, 100px);
      line-height: 1;
      margin-bottom: 20px;

      text-shadow:
        0 0 20px rgba(170, 100, 255, 0.5),
        0 0 60px rgba(130, 70, 255, 0.3);
    }

    h2 {
      font-size: clamp(30px, 6vw, 60px);
      margin-bottom: 15px;
    }

    p {
      color: #bdb8ca;
      font-size: 16px;
      line-height: 2;
      margin-bottom: 25px;
    }

    .portal {
      width: 190px;
      height: 300px;

      margin: 30px auto;

      border: 2px solid rgba(190, 140, 255, 0.7);
      border-radius: 50%;

      position: relative;
      overflow: hidden;

      box-shadow:
        0 0 20px rgba(160, 90, 255, 0.7),
        0 0 100px rgba(110, 50, 220, 0.3),
        inset 0 0 50px rgba(160, 90, 255, 0.4);
    }

    .portal::before {
      content: "";

      position: absolute;
      inset: 8px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 50% 70%,
          rgba(240, 210, 255, 0.9),
          rgba(120, 60, 190, 0.5) 20%,
          rgba(5, 3, 18, 1) 65%
        );

      animation: breathe 3s ease-in-out infinite;
    }

    @keyframes breathe {
      50% {
        transform: scale(1.05);
        filter: brightness(1.5);
      }
    }

    button {
      border: 1px solid rgba(180, 120, 255, 0.6);

      background: rgba(255, 255, 255, 0.05);

      color: white;

      border-radius: 50px;

      padding: 14px 30px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.3s;

      backdrop-filter: blur(10px);
    }

    button:hover {
      transform: translateY(-3px);

      box-shadow:
        0 0 30px rgba(160, 90, 255, 0.4);
    }

    .choices {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 15px;

      margin-top: 30px;
    }

    .choice {
      min-height: 85px;

      border-radius: 20px;

      font-size: 15px;
    }

    .symbol {
      font-size: 70px;

      margin-bottom: 10px;

      text-shadow:
        0 0 30px rgba(190, 120, 255, 0.8);
    }

    .final {
      background:
        radial-gradient(
          circle at center,
          #160b2d,
          #03030b 55%,
          #000 100%
        );
    }

    .final h1 {
      font-size: clamp(55px, 12vw, 120px);
    }

    @media (max-width: 600px) {

      .choices {
        grid-template-columns: 1fr;
      }

      .portal {
        width: 150px;
        height: 240px;
      }

      p {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <canvas id="space"></canvas>

  <div class="overlay"></div>


  <!-- البداية -->

  <section class="screen active" id="start">

    <div class="content">

      <div class="small">
        WELCOME TO THE UNKNOWN
      </div>

      <h1>
        قبل ما تدخل...
      </h1>

      <p>
        خد نفس.<br>
        وسيب العالم برّه.
      </p>

      <div class="portal"></div>

      <button onclick="goTo('choice')">
        ابدأ الرحلة ←
      </button>

    </div>

  </section>


  <!-- الاختيار -->

  <section class="screen" id="choice">

    <div class="content">

      <div class="small">
        THE FIRST DOOR
      </div>

      <h2>
        اختار أول إحساس جالك.
      </h2>

      <p>
        مفيش إجابة صح أو غلط.
      </p>

      <div class="choices">

        <button
          class="choice"
          onclick="choose('light')">
          ☀️ النور
        </button>

        <button
          class="choice"
          onclick="choose('silence')">
          ◌ السكوت
        </button>

        <button
          class="choice"
          onclick="choose('fear')">
          ⌁ الخوف
        </button>

        <button
          class="choice"
          onclick="choose('curiosity')">
          ✦ الفضول
        </button>

      </div>

    </div>

  </section>


  <!-- النتيجة -->

  <section class="screen" id="result">

    <div class="content">

      <div
        class="symbol"
        id="symbol">
        ✦
      </div>

      <div class="small">
        UNKNOWN
      </div>

      <h2 id="resultTitle">
        ...
      </h2>

      <p id="resultText">
        ...
      </p>

      <button onclick="goTo('second')">
        افتح الباب التالي
      </button>

    </div>

  </section>


  <!-- المرحلة الثانية -->

  <section class="screen" id="second">

    <div class="content">

      <div class="small">
        ONE LAST THING
      </div>

      <h2>
        قبل النهاية...
      </h2>

      <p>
        اختار كلمة واحدة فقط.<br>
        متفكرش.
      </p>

      <div class="choices">

        <button
          class="choice"
          onclick="finish('now')">
          الآن
        </button>

        <button
          class="choice"
          onclick="finish('later')">
          بعدين
        </button>

        <button
          class="choice"
          onclick="finish('always')">
          دائمًا
        </button>

        <button
          class="choice"
          onclick="finish('never')">
          أبدًا
        </button>

      </div>

    </div>

  </section>


  <!-- النهاية -->

  <section class="screen final" id="final">

    <div class="content">

      <div class="small">
        UNKNOWN / FINAL
      </div>

      <div class="symbol">
        ∞
      </div>

      <h1 id="finalTitle">
        ...
      </h1>

      <p id="finalText">
        ...
      </p>

      <button onclick="goTo('start')">
        ↻ ابدأ من جديد
      </button>

    </div>

  </section>


  <script>

    /* =========================
       خلفية النجوم
    ========================= */

    const canvas =
      document.getElementById("space");

    const ctx =
      canvas.getContext("2d");

    let width;
    let height;

    let stars = [];


    function resize() {

      width =
        canvas.width =
        window.innerWidth *
        window.devicePixelRatio;

      height =
        canvas.height =
        window.innerHeight *
        window.devicePixelRatio;


      stars = [];


      for (
        let i = 0;
        i < 450;
        i++
      ) {

        stars.push({

          x: Math.random() * width,

          y: Math.random() * height,

          size:
            Math.random() * 2 + 0.2,

          speed:
            Math.random() * 1.5 + 0.2

        });

      }

    }


    window.addEventListener(
      "resize",
      resize
    );


    resize();


    function animate() {

      ctx.clearRect(
        0,
        0,
        width,
        height
      );


      const gradient =
        ctx.createRadialGradient(
          width * 0.5,
          height * 0.5,
          0,

          width * 0.5,
          height * 0.5,
          Math.max(width, height)
        );


      gradient.addColorStop(
        0,
        "#17102d"
      );

      gradient.addColorStop(
        0.5,
        "#060617"
      );

      gradient.addColorStop(
        1,
        "#000107"
      );


      ctx.fillStyle = gradient;

      ctx.fillRect(
        0,
        0,
        width,
        height
      );


      stars.forEach(star => {

        star.y -= star.speed;


        if (star.y < 0) {

          star.y = height;

        }


        ctx.globalAlpha =
          0.2 +
          Math.random() * 0.6;


        ctx.fillStyle = "#ffffff";


        ctx.fillRect(
          star.x,
          star.y,
          star.size,
          star.size
        );

      });


      ctx.globalAlpha = 1;


      requestAnimationFrame(
        animate
      );

    }


    animate();


    /* =========================
       التنقل
    ========================= */

    function goTo(id) {

      const screens =
        document.querySelectorAll(
          ".screen"
        );


      screens.forEach(screen => {

        screen.classList.remove(
          "active"
        );

      });


      const target =
        document.getElementById(id);


      target.classList.add(
        "active"
      );

    }


    /* =========================
       الاختيار الأول
    ========================= */

    function choose(type) {

      const data = {

        light: {

          title:
            "النور اختارك.",

          text:
            "يمكن لأنك طول الوقت بتدور على حاجة واضحة وسط كل ده. بس مش كل نور بيكشف الحقيقة.",

          symbol:
            "☀️"

        },


        silence: {

          title:
            "إنت سمعت السكوت.",

          text:
            "وده نادر. لأن أغلب الناس بتخاف من اللحظة اللي مفيهاش صوت.",

          symbol:
            "◌"

        },


        fear: {

          title:
            "الخوف دخل قبلك.",

          text:
            "بس الغريب؟ إنك كملت رغم وجوده. يمكن دي كانت الإجابة من البداية.",

          symbol:
            "⌁"

        },


        curiosity: {

          title:
            "الفضول كسب.",

          text:
            "وده أخطر اختيار في الرحلة دي كلها… لأنه مبيسمحلكش ترجع زي ما كنت.",

          symbol:
            "✦"

        }

      };


      const result =
        data[type];


      document.getElementById(
        "resultTitle"
      ).textContent =
        result.title;


      document.getElementById(
        "resultText"
      ).textContent =
        result.text;


      document.getElementById(
        "symbol"
      ).textContent =
        result.symbol;


      goTo("result");

    }


    /* =========================
       النهاية
    ========================= */

    function finish(type) {

      const endings = {

        now: {

          title:
            "دلوقتي.",

          text:
            "كل حاجة مهمة حصلت لما بطلت تستنى."

        },


        later: {

          title:
            "بعدين.",

          text:
            "أحيانًا التأجيل مش هروب… أحيانًا هو وقتك الحقيقي."

        },


        always: {

          title:
            "دائمًا.",

          text:
            "بعض الحكايات مبتنتهيش، حتى لما الصفحة تقفل."

        },


        never: {

          title:
            "أبدًا.",

          text:
            "يمكن بعض الأبواب اتعملت عشان تتساب مقفولة."

        }

      };


      const ending =
        endings[type];


      document.getElementById(
        "finalTitle"
      ).textContent =
        ending.title;


      document.getElementById(
        "finalText"
      ).textContent =
        ending.text;


      goTo("final");

    }

  </script>

</body>
  </html>
